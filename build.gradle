buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = '0.4.0-alpha.2'
group = 'dev.lastpagans.recruitsperformance'
base { archivesName = 'recruits-performance-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { recruitsperformance { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { recruitsperformance { source sourceSets.main } }
        }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'Recruits Performance',
            'Specification-Vendor': 'Last Pagans',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Last Pagans'
        ])
    }
}

jar.finalizedBy('reobfJar')

