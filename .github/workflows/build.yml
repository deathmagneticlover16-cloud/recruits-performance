name: Build

on:
  push:
    branches: [main, gpu-crowd-renderer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Compile and run contract tests
        run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recruits-performance-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
